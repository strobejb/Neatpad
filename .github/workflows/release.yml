name: Release

on:
  push:
    tags:
      - 'v*'
      - 'tutorial/part-*'
  # For existing tags (they predate this workflow, so pushing them won't trigger it):
  #   gh workflow run release.yml -f tag=tutorial/part-07
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.2.3 or tutorial/part-07)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CONFIGURATION: Release

jobs:
  release:
    # Pinned: the projects use the v143 (VS 2022) toolset.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      # Releases are 64-bit. Older tags predate the x64 configurations, so they
      # can only build Win32.
      - name: Choose platform
        shell: bash
        run: |
          if grep -q "Release|x64" Neatpad.sln; then
            echo "PLATFORM=x64" >> "$GITHUB_ENV"
          else
            echo "PLATFORM=Win32" >> "$GITHUB_ENV"
          fi

      - name: Stamp version into resource.rc
        id: version
        shell: python
        run: |
          import os, re, sys

          # The app moved to src/Neatpad/win32; older tags have it in src/Neatpad.
          RC_PATH = next(p for p in ("src/Neatpad/win32/resource.rc", "src/Neatpad/resource.rc")
                         if os.path.exists(p))
          tag = os.environ["TAG"]

          if m := re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:[-+].*)?", tag):
              major, minor, patch = map(int, m.groups())
              display = tag[1:]                      # keeps any -prerelease suffix
              title = f"Neatpad {display}"
          elif m := re.fullmatch(r"tutorial/part-(\d+)", tag):
              major, minor, patch = 0, int(m[1]), 0  # tutorial/part-07 -> 0.7.0
              display = f"{major}.{minor}.{patch}"
              title = f"Neatpad {display} (tutorial part {m[1]})"
          else:
              sys.exit(f"Unrecognised tag '{tag}': expected vX.Y.Z or tutorial/part-N")

          build = 0
          numeric = f"{major},{minor},{patch},{build}"
          file_version = f"{major}.{minor}.{patch}.{build}"
          if any(n > 65535 for n in (major, minor, patch, build)):
              sys.exit(f"Version {numeric} has a component > 65535 (VERSIONINFO limit)")

          # latin-1 round-trips every byte (file is cp1252, e.g. the (c) sign);
          # newline="" preserves CRLF.
          with open(RC_PATH, encoding="latin-1", newline="") as f:
              rc = f.read()

          if "VS_VERSION_INFO" not in rc:
              # Early tutorial parts have no version resource, so add one.
              nl = "\r\n" if "\r\n" in rc else "\n"
              rc += nl.join([
                  "",
                  "VS_VERSION_INFO VERSIONINFO",
                  " FILEVERSION 0,0,0,0",
                  " PRODUCTVERSION 0,0,0,0",
                  " FILEFLAGSMASK 0x3fL",
                  " FILEFLAGS 0x0L",
                  " FILEOS 0x40004L",
                  " FILETYPE 0x1L",
                  " FILESUBTYPE 0x0L",
                  "BEGIN",
                  '    BLOCK "StringFileInfo"',
                  "    BEGIN",
                  '        BLOCK "080904b0"',
                  "        BEGIN",
                  '            VALUE "CompanyName", "Catch22 Solutions"',
                  '            VALUE "FileDescription", "Neatpad Text Editor"',
                  '            VALUE "FileVersion", ""',
                  '            VALUE "InternalName", "Neatpad"',
                  '            VALUE "OriginalFilename", "Neatpad.exe"',
                  '            VALUE "ProductName", "Neatpad"',
                  '            VALUE "ProductVersion", ""',
                  "        END",
                  "    END",
                  '    BLOCK "VarFileInfo"',
                  "    BEGIN",
                  '        VALUE "Translation", 0x809, 1200',
                  "    END",
                  "END",
                  "",
              ])

          rc, n1 = re.subn(
              r"^(\s*(?:FILE|PRODUCT)VERSION\s+)\d+\s*,\s*\d+\s*,\s*\d+\s*,\s*\d+",
              rf"\g<1>{numeric}", rc, flags=re.M)
          rc, n2 = re.subn(
              r'(VALUE\s+"FileVersion",\s*)"[^"]*"',
              rf'\g<1>"{file_version}"', rc)
          rc, n3 = re.subn(
              r'(VALUE\s+"ProductVersion",\s*)"[^"]*"',
              rf'\g<1>"{display}"', rc)
          if (n1, n2, n3) != (2, 1, 1):
              sys.exit(f"Expected 2+1+1 version replacements, got {n1}+{n2}+{n3} in {RC_PATH}")

          # About dialog title (only present from part 18 onwards).
          rc = re.sub(r'"[^"]*"(\s*,\s*IDC_ABOUT_APPNAME\b)',
                      rf'"Neatpad {display}"\g<1>', rc)
          rc = rc.replace("Catch22 Productions", "Catch22 Solutions")

          with open(RC_PATH, "w", encoding="latin-1", newline="") as f:
              f.write(rc)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={display}\ntitle={title}\nzip=neatpad-v{display}.zip\n")
          print(f"{tag} -> {numeric} / FileVersion \"{file_version}\" / ProductVersion \"{display}\"")

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild Neatpad.sln /t:Neatpad /m /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM

      # A release is only published if its tests pass. Older tags have none.
      - name: Test
        if: hashFiles('tests/SequenceTests.vcxproj') != ''
        run: |
          msbuild Neatpad.sln /t:SequenceTests /m /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "build/$env:PLATFORM/$env:CONFIGURATION/SequenceTests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # neatpad.exe on its own, and a zip of it with the readme and licence
      - name: Collect artifacts
        shell: bash
        env:
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          mkdir -p dist/zip
          # Since the directory restructure, projects build to build/<Platform>/<Configuration>;
          # older tags built to <Configuration>.
          for exe in "build/$PLATFORM/$CONFIGURATION/Neatpad.exe" "$CONFIGURATION/Neatpad.exe"; do
            if [ -f "$exe" ]; then
              cp "$exe" dist/neatpad.exe
              cp "$exe" dist/zip/neatpad.exe
              cp README.md LICENCE.TXT dist/zip/
              (cd dist/zip && 7z a -tzip "../$ZIP" neatpad.exe README.md LICENCE.TXT)
              exit 0
            fi
          done
          echo "Neatpad.exe not found"
          exit 1

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.version.outputs.title }}
          ZIP: ${{ steps.version.outputs.zip }}
        run: |
          # Tutorial releases must never become "Latest", even when run retrospectively.
          latest=true
          [[ "$TAG" == tutorial/* ]] && latest=false

          # The release may already exist (created in the GitHub UI, or a re-run).
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TITLE" --generate-notes --latest=$latest
          fi
          gh release upload "$TAG" dist/neatpad.exe "dist/$ZIP" -R "$GITHUB_REPOSITORY" --clobber

  # The GNOME app as a Flatpak bundle, added to the release the Windows job
  # made. Installing it fetches the GNOME runtime from Flathub.
  flatpak:
    needs: release
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      # Older tags have no manifest
      - name: Check for the manifest
        id: manifest
        shell: bash
        run: |
          if [ -f src/Neatpad/gtk/net.catch22.Neatpad.yml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install flatpak-builder
        if: steps.manifest.outputs.found
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build the bundle
        if: steps.manifest.outputs.found
        shell: bash
        run: |
          ASSET="neatpad-$TAG.flatpak"
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --state-dir=build/flatpak-state --repo=build/flatpak-repo build/flatpak \
            src/Neatpad/gtk/net.catch22.Neatpad.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            build/flatpak-repo "$ASSET" net.catch22.Neatpad
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Publish the bundle
        if: steps.manifest.outputs.found
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" -R "$GITHUB_REPOSITORY" --clobber
