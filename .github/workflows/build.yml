name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  build:
    # Pinned: the projects use the v143 (VS 2022) toolset.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # Builds Neatpad and the tests
      - name: Build
        run: msbuild Neatpad.sln /m /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM

      - name: Test
        run: |
          & "build/$env:PLATFORM/$env:CONFIGURATION/SequenceTests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  linux:
    # The portable parts, built with CMake: TextDocument and the core tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=$CONFIGURATION
          cmake --build build/cmake

      - name: Test
        run: ctest --test-dir build/cmake --output-on-failure
