name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  build:
    # Pinned: the projects use the v143 (VS 2022) toolset.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # Builds Neatpad and the tests
      - name: Build
        run: msbuild Neatpad.sln /m /p:Configuration=$env:CONFIGURATION /p:Platform=$env:PLATFORM

      - name: Test
        run: |
          & "build/$env:PLATFORM/$env:CONFIGURATION/SequenceTests.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  linux:
    # Built with CMake: TextDocument, the TextView engine, the GTK view, and
    # their tests. The GTK tests need a display, so they run under Xvfb.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # MSVC reads source in the ANSI code page, so text beyond ASCII is
      # escaped (é), never written as itself
      - name: Sources are ASCII
        run: |
          if git ls-files 'src/*.c' 'src/*.cpp' 'src/*.h' 'tests/*.c' 'tests/*.cpp' 'tests/*.h' \
             | xargs grep -nP '[^\x00-\x7F]'; then
            echo "::error::non-ASCII characters in source: escape them"
            exit 1
          fi

      - name: Install GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev xvfb

      - name: Build
        run: |
          cmake -S . -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=$CONFIGURATION
          cmake --build build/cmake

      - name: Test
        run: xvfb-run -a ctest --test-dir build/cmake --output-on-failure
